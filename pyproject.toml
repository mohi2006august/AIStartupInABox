[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-in-a-box"
version = "0.1.0"
description = "AI Startup-in-a-Box: a vertical AI SaaS (legal research assistant) wired to its unit economics."
requires-python = ">=3.11"
authors = [{ name = "mohi2006august" }]
readme = "README.md"
dependencies = ["numpy>=1.26", "pydantic>=2.6", "pydantic-settings>=2.2", "fastapi>=0.110", "uvicorn>=0.29", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
claude = ["anthropic"]
stripe = ["stripe>=16"]

[project.scripts]
sib = "sib.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sib = ["web/*.html", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
