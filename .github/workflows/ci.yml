name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,stripe]"
      - run: pytest -q
      - name: Quality gates (no release if a blocking gate fails)
        run: sib evals
